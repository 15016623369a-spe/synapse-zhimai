name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run pytest
        run: python -m pytest -q
        working-directory: backend

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  docker:
    name: Docker image & runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t synapse:ci .
      - name: Run container smoke test
        run: |
          set -euo pipefail
          cleanup() { docker rm -f synapse-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name synapse-ci -p 127.0.0.1:7800:7800 synapse:ci
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:7800/api/health > /tmp/synapse-health.json; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Container did not become healthy"; docker ps -a; docker logs synapse-ci; exit 1
            fi
            sleep 2
          done
          echo "health response:"; cat /tmp/synapse-health.json; echo
          python3 - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:7800"
          health = json.load(urllib.request.urlopen(base + "/api/health", timeout=10))
          assert health["status"] == "ok", health
          assert health["documents"] >= 16, health
          assert health["chunks"] > 0, health
          docs = json.load(urllib.request.urlopen(base + "/api/documents", timeout=10))
          assert docs["total"] >= 16, docs["total"]
          print("health:", health)
          print("documents:", docs["total"], "chunks:", health["chunks"])
          PY
